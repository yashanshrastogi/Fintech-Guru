name: FinTech Guru V2 CI

on:
  push:
    branches: [ "main", "v2-production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: guru_user
          POSTGRES_PASSWORD: guru_password
          POSTGRES_DB: fintech_guru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx
        
    - name: Run Alembic Migrations
      env:
        DATABASE_URL: postgresql://guru_user:guru_password@localhost:5432/fintech_guru_test
      run: |
        alembic upgrade head
        
    - name: Run All Tests
      env:
        DATABASE_URL: sqlite:///./test.db # Use sqlite for unit tests of engine if needed, or postgres
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Run all tests instead of just failure injection
        pytest tests/ -v --cov=core --cov=app --cov=validation --cov=optimization
        
    - name: Build Docker Image
      run: |
        docker build -t fintech-guru-api:latest .
